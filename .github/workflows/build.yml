name: Build Tehran RP APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download & Extract Source Code
        run: |
          curl -L -o source.zip https://github.com/${{ github.repository }}/releases/download/v1.0/TehranRp_Source_Modified.zip
          unzip -o source.zip
          if [ -d "Tehran-Rp" ]; then cp -r Tehran-Rp/* . ; fi
          if [ -d "TehranRp" ]; then cp -r TehranRp/* . ; fi
          chmod +x gradlew || true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tehran-RP-Debug-APK
          path: '**/build/outputs/apk/**/*.apk'

      - name: Attach APK to Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0
          files: '**/build/outputs/apk/**/*.apk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
