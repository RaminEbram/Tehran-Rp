name: Build Tehran RP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Download & Extract Source Code
      run: |
        curl -L -o source.zip "https://github.com/RaminEbram/Tehran-Rp/releases/download/v1.0/TehranRp_Source_Modified.zip"
        unzip -q -o source.zip
        if [ ! -f "gradlew" ]; then
          SUBDIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
            cp -rn "$SUBDIR"/* .
          fi
        fi
        chmod +x gradlew

    - name: Build Android APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TehranRP-Debug-APK
        path: app/build/outputs/apk/**/*.apk

    - name: Attach APK to Releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload v1.0 app/build/outputs/apk/**/*.apk --clobber || true
